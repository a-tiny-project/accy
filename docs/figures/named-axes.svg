<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t d">
<title id="t">Names decide how arrays combine: a missing axis repeats, a new name forms a grid, and sum removes the axis it names</title>
<desc id="d">Left, one guess: frequency has no axes and time has sixteen elements along point, so the squared differences between predictions and samples form one row of sixteen, and sum along point leaves one mismatch. Right, eight guesses: frequency has eight elements along guess, so the squared differences form a grid of eight rows by sixteen points, and sum along point leaves eight mismatches, one per guess. Bottom: time has sixteen elements along point and sample has fifteen, marked in red, so define stops with error.AxisExtentMismatch.</desc>
