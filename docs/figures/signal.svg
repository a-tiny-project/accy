<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-labelledby="t d">
<title id="t">Fitting a frequency means making the predicted wave pass through the samples</title>
<desc id="d">Sixteen samples of sin(3 t) at times 0, 0.25, through 3.75, drawn as dots. A solid curve, the prediction for frequency 3, passes through every sample. A dashed curve, the prediction for frequency 2.5, misses them, and red vertical segments mark each gap between prediction and sample. The mismatch adds the squares of these gaps: about 8.656 for 2.5 and 0 for 3.</desc>
