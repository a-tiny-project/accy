<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Eight guesses descend the mismatch curve at once, and two reach the true frequency</title>
<desc id="d">The mismatch as a function of frequency from -0.5 to 8.5, with valleys near 0, 1.05, 3, 4.97, and 6.6. Eight guesses start at 0.5, 1.5, through 7.5 (open circles) and take 100 gradient-descent updates (filled circles). The guesses that start at 2.5 and 3.5, in red, end within 0.000001 of 3, where the mismatch is near zero. The others end in other valleys, near -0.04, 1.05, 4.97, 4.97, 6.60, and 8.23, with mismatch between 7.9 and 14.6.</desc>
